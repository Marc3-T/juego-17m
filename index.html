<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="17 Meses">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤️</text></svg>">
    <title>17 Meses</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Pantalla de inicio -->
    <div id="pantalla-inicio" class="pantalla">
        <div class="contenido-inicio">
            <h1 class="titulo">Minijuego</h1>
            <p class="subtitulo">Para mi amor hermosa ❤️✨</p>
            <button id="boton-empezar" class="boton-corazon">Iniciar</button>
            <p class="sugerencia"></p>
        </div>
    </div>

    <!-- Juego (oculto inicialmente) -->
    <canvas id="canvas-juego" class="oculto"></canvas>

    <!-- Pantalla de Game Over (derrota) -->
    <div id="pantalla-perdiste" class="pantalla oculto">
        <div class="contenido-mensaje">
            <h2>Tu puedes mi amor hermosa</h2>
            <p>Recuerda siempre que eres la mejor mi amor ❤️</p>
            <button id="boton-reintentar" class="boton-corazon">Reintentar</button>
        </div>
    </div>

    <!-- Pantalla de victoria (17 meses) -->
    <div id="pantalla-ganaste" class="pantalla oculto">
        <div class="contenido-mensaje">
            <h2>✨❤️ Eres la mejor mi amor ❤️✨</h2>
            <p id="mensaje-final">Cada día a tu lado es un regalo<br>Te amo con todo mi corazón amor de mi vida</p>
            <div id="foto-sorpresa">
                <!-- Aquí puedes poner una imagen sorpresa -->
                <!-- <img src="assets/foto-final.jpg" alt="Nosotros" style="max-width: 250px; border-radius: 20px;"> -->
            </div>
            <button id="boton-reiniciar" class="boton-corazon">Jugar otra vez 💖</button>
        </div>
    </div>

    <!-- Librería de confeti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
